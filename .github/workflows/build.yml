name: CI/CD Backend

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:

  quality:

    name: Calidad, Seguridad y Despliegue Backend
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn clean verify

      - name: Revisar dependencias
        run: mvn dependency:tree

      - name: Analizar código SonarCloud
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t backend:ci .

      - name: Validar Docker Compose
        run: docker compose config

      - name: Levantar ambiente
        run: docker compose up -d --build

      - name: Verificar salud del backend
        run: |
          for i in {1..24}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              echo "Backend funcionando correctamente"
              exit 0
            fi
            sleep 5
          done

          docker compose logs backend
          exit 1

      - name: Detener ambiente
        if: always()
        run: docker compose down