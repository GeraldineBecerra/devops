version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: pokecardstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: backend
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pokecardstore
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
  prometheus:
      image: prom/prometheus:latest
      container_name: pokecard-prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      depends_on:
        - backend

  grafana:
      image: grafana/grafana:latest
      container_name: pokecard-grafana
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: devops
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus

volumes:
  postgres_data:
  grafana_data: